name: CI
on:
  pull_request:
  push:
    # Master only — an unfiltered `push` made every same-repo PR branch
    # (scala-steward especially) run the suite TWICE: once for the push
    # event and once for the pull_request event.
    branches: [master]
  workflow_dispatch:
# A newer push to the same ref supersedes an in-flight run — rapid
# consecutive pushes were each burning a full ~23-minute billed run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      id-token: write
    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: basic
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: jdbc:postgresql://localhost:5432/basic
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      # Wall-clock on `sbt test` is dominated by per-suite fork overhead
      # (JVM boot + RocksDB/Lucene init across ~500 suites) — init-I/O
      # bound, so modest oversubscription of the 4-vCPU runner helps.
      SIGIL_TEST_FORK_CONCURRENCY: 6
      # Cap per-fork heap for the 16 GB runner — the local default is
      # -Xmx16G per forked JVM, which over-commits the box with several
      # concurrent forks.
      SIGIL_TEST_FORK_HEAP: 2G
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          # Pinned to 21 LTS — Java 25 surfaces intermittent
          # ClassCastException patterns in rapid's Task pipeline
          # (`RespondFieldTool$` / `Boolean` / `BoxedUnit` casts
          # failing under StaticToolSyncUpgrade + maintenance
          # sweeps). The same code runs clean on local Java 21/26
          # but CI's 25 was aborting ~half of recent pushes.
          # Revisit once rapid 2.5+ ships its Java 25-compatible
          # interpreter.
          java-version: 21
      - name: Setup sbt launcher
        uses: sbt/setup-sbt@v1
      - name: Coursier cache
        uses: coursier/cache-action@v8
      # Compiled-classes + zinc cache: restores the nearest previous
      # build so a typical push recompiles only its delta instead of the
      # full ~3.5-minute cold build. Keyed exact on the commit (always
      # saves), restored by prefix (nearest ancestor build).
      - name: Compiled targets cache
        uses: actions/cache@v4
        with:
          path: |
            **/target
            !**/target/wire-logs
            project/target
          key: targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-${{ github.sha }}
          restore-keys: |
            targets-${{ runner.os }}-${{ hashFiles('build.sbt', 'project/**') }}-
      - name: Set CI JVM options
        run: echo "SBT_OPTS=-Xms512M -Xmx2G -Xss16M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=." >> $GITHUB_ENV
      - name: Build and test
        env:
          GITHUB_TOKEN: ${{ secrets.ADMIN_GITHUB_TOKEN }}
        run: |
          sbt -v -Dfile.encoding=UTF-8 test
          rm -rf "$HOME/.ivy2/local" || true
          find $HOME/Library/Caches/Coursier/v1        -name "ivydata-*.properties" -delete || true
          find $HOME/.ivy2/cache                       -name "ivydata-*.properties" -delete || true
          find $HOME/.cache/coursier/v1                -name "ivydata-*.properties" -delete || true
          find $HOME/.sbt                              -name "*.lock"               -delete || true
